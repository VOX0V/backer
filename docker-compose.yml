services:
  backer:
    # En production, remplace "build" par l'image publiée sur GHCR une fois
    # le workflow CI passé, ex: image: ghcr.io/<pseudo>/backer:latest
    build:
      context: ./backer
    container_name: backer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      # Données persistantes (base SQLite + clé de session) -- HORS du repo,
      # jamais copiées dans l'image (voir backer/.dockerignore).
      - ./data:/app/data

      # Sources à sauvegarder, montées en LECTURE SEULE : adapte les chemins
      # hôtes à ta machine. Doivent correspondre aux BACKN_SOURCE du .env.
      - /home/srv:/mnt/sources/srv:ro
      - /mnt/netsec:/mnt/sources/netsec:ro
      - /mnt/piserv:/mnt/sources/piserv:ro

      # Destination des archives, seule racine montée en écriture. Doit
      # correspondre aux BACKN_DEST du .env.
      - /mnt/hdd:/mnt/sources/hdd

    mem_limit: 512m
    cpus: 1.0

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
