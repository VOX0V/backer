name: Build et publier l'image Docker

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer QEMU (émulation arm64)
        uses: docker/setup-qemu-action@v3

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./backer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backer:latest
            ghcr.io/${{ github.repository_owner }}/backer:${{ github.sha }}
